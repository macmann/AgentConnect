name: agentconnect-release
x-service: &service
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: ["/tmp:size=256m,mode=1777"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 120s
services:
  api:
    <<: *service
    image: ${API_IMAGE:?Select an immutable API image digest}
    env_file:
      - path: ${RUNTIME_ENV_FILE:?Select the protected runtime environment file}
        format: raw
    environment:
      NODE_ENV: production
      PORT: "4000"
    ports: ["127.0.0.1:${API_PORT:-4000}:4000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 8s
      start_period: 30s
      retries: 4
  worker:
    <<: *service
    image: ${WORKER_IMAGE:?Select an immutable worker image digest}
    env_file:
      - path: ${RUNTIME_ENV_FILE:?Select the protected runtime environment file}
        format: raw
    environment:
      NODE_ENV: production
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: "4100"
    ports: ["127.0.0.1:${WORKER_HEALTH_PORT:-4100}:4100"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4100/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      start_period: 60s
      retries: 4
  web:
    <<: *service
    image: ${WEB_IMAGE:?Select an immutable web image digest}
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    # Next.js may maintain its runtime cache; the rest of the image stays read-only.
    tmpfs:
      [
        "/tmp:size=256m,mode=1777",
        "/app/apps/web/.next/cache:uid=1000,gid=1000,mode=0700,size=128m",
      ]
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
