# Private deployment network only. Mount the bearer token file read-only.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: agentconnect-api
    metrics_path: /internal/metrics
    scrape_timeout: 10s
    authorization:
      type: Bearer
      credentials_file: /run/secrets/agentconnect_monitoring_token
    static_configs:
      - targets: [api:4000]
  - job_name: agentconnect-worker
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/agentconnect_monitoring_token
    static_configs:
      - targets: [worker:4100]
