name: Validate
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm local:init
      - run: pnpm infra:up
      - run: pnpm db:migrate && pnpm storage:init
      - run: pnpm lint && pnpm typecheck
      # No background application worker competes with fixture leases.
      - name: API regressions against isolated CI services
        env:
          NODE_ENV: test
          REQUIRE_EMAIL_VERIFICATION: "true"
        run: |
          set -euo pipefail
          for file in apps/api/test/*.test.ts; do
            # Only the disposable hosted-runner Redis instance is cleared.
            docker compose exec -T redis redis-cli FLUSHDB >/dev/null
            (cd apps/api && pnpm exec tsx --env-file=../../.env --test "${file#apps/api/}")
          done
      - run: node --test tests/release/*.test.mjs
      - run: pnpm build
      - name: Build and smoke release images
        run: |
          set -euo pipefail
          for service in api worker web; do
            docker build --target "$service" --build-arg NEXT_PUBLIC_API_URL=https://api.agentconnect.example --tag "agentconnect-release-$service:test" .
          done
          node --env-file=.env scripts/release-smoke.mjs
      - run: pnpm infra:down
        if: always()
